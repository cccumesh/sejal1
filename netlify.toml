[build]
  command = "node scripts/verify-netlify-env.mjs && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Table name + dashboard path live in repo as defaults — not secrets.
  SECRETS_SCAN_OMIT_KEYS = "VITE_DASHBOARD_PATH,VITE_SUPABASE_LEDGER_TABLE"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
